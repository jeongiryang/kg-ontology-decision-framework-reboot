schema_version: "1.0.0"
project:
  name: kg-ontology-decision-framework-reboot
  initial_scope:
    academic_year: 2026
    department: "컴퓨터공학과"
  answer_statuses:
    - supported
    - insufficient_evidence
    - conflict
    - out_of_scope

upstream:
  repository: https://github.com/jeongiryang/codex-harness
  commit: 79b82281d305c89181fbb216499d5f1e962c14ed
  license: Apache-2.0

orchestration:
  coordinator: main_session
  max_concurrent_agents: 3
  patterns:
    - pipeline
    - fan_out_fan_in
    - generate_validate
    - student_question_evaluate_repair
  student_question_evaluation:
    maximum_repair_cycles: 2
    question_generator_creates_answers: false
    heldout_isolated_from_implementation: true
    completion_requires_no_wrong_supported_claims: true
    milestone_overrides:
      - run_id: 20261002-b-dialogue-v2
        maximum_total_repair_cycles: 4
        previous_repair_cycles: 2
        maximum_additional_repair_cycles: 2
        decision: docs/harness/decisions/0027-prototype-dialogue-repair-and-observed-progress.md
      - run_id: 20261001-semantic-final-integration
        maximum_total_repair_cycles: 3
        decision: docs/harness/decisions/0023-semantic-course-retrieval-and-student-evaluation.md
      - run_id: 20261001-purpose-dialogue-implementation-v1
        maximum_total_repair_cycles: 5
        previous_repair_cycles: 3
        maximum_additional_repair_cycles: 2
        decision: docs/harness/decisions/0024-purpose-aware-dialogue-and-resume.md
  single_writer_per_path: true
  source_precedence:
    - university_statute
    - curriculum
    - department_guidance
    - validation_aid

agents:
  - name: harness_explorer
    config: .codex/agents/harness-explorer.toml
    permission: read_only
    input: task_packet
    output: exploration_findings
  - name: harness_architect
    config: .codex/agents/harness-architect.toml
    permission: read_only
    input: task_packet
    output: architecture_proposal
  - name: academic_source_auditor
    config: .codex/agents/academic-source-auditor.toml
    permission: read_only
    input: academic_sources
    output: SourceEntry
  - name: academic_rule_modeler
    config: .codex/agents/academic-rule-modeler.toml
    permission: assigned_contract_paths
    input: approved_SourceEntry
    output: RuleFact
  - name: academic_review_facilitator
    config: .codex/agents/academic-review-facilitator.toml
    permission: read_only
    input: SourceEntry_RuleFact_AcademicReviewPacket
    output: AcademicClarificationPacket
  - name: harness_worker
    config: .codex/agents/harness-worker.toml
    permission: assigned_product_paths
    input: task_packet
    output: TaskResult
  - name: academic_student_question_generator
    config: .codex/agents/academic_student_question_generator.toml
    permission: read_only
    input: verified_source_topics_and_scope
    output: student_questions_without_answer_keys
    skills:
      - academic-student-question-evaluation
  - name: harness_reviewer
    config: .codex/agents/harness-reviewer.toml
    permission: read_only
    input: diff_and_acceptance
    output: review_findings
  - name: harness_qa
    config: .codex/agents/harness-qa.toml
    permission: assigned_test_and_verification_paths
    input: implementation_and_acceptance
    output: TaskResult
    skills:
      - academic-evaluation
  - name: dsw_compute_operator
    config: .codex/agents/dsw-compute-operator.toml
    permission: approved_server_job_and_assigned_run_paths
    input: DSWRunRequest
    output: TaskResult

skills:
  - name: harness
    path: .agents/skills/harness/SKILL.md
    trigger: harness_creation_migration_extension_or_audit
  - name: academic-assistant-orchestrator
    path: .agents/skills/academic-assistant-orchestrator/SKILL.md
    trigger: academic_assistant_feature_or_partial_rerun
  - name: academic-source-grounding
    path: .agents/skills/academic-source-grounding/SKILL.md
    trigger: academic_source_registration_or_citation_audit
  - name: academic-rule-modeling
    path: .agents/skills/academic-rule-modeling/SKILL.md
    trigger: academic_rule_or_ontology_change
  - name: academic-clarification
    path: .agents/skills/academic-clarification/SKILL.md
    trigger: unresolved_academic_review_question_or_review_session
  - name: academic-evaluation
    path: .agents/skills/academic-evaluation/SKILL.md
    trigger: academic_answer_QA
  - name: academic-student-question-evaluation
    path: .agents/skills/academic-student-question-evaluation/SKILL.md
    trigger: student_question_generation_evaluation_and_bounded_repair
  - name: dsw-server-operations
    path: .agents/skills/dsw-server-operations/SKILL.md
    trigger: approved_DSW_compute_operation
  - name: completion-reporting
    path: .agents/skills/completion-reporting/SKILL.md
    trigger: completed_run_reporting

contracts:
  schemas:
    AssistantProgressEvent:
      path: contracts/assistant-progress-event.schema.json
      version: "1.0.0"
    AssistantTurnRequest:
      path: contracts/assistant-turn-request.schema.json
      version: "1.0.0"
    AssistantTurnResponse:
      path: contracts/assistant-turn-response.schema.json
      version: "1.0.0"
    CourseEvidencePacket:
      path: contracts/course-evidence-packet.schema.json
      version: "1.0.0"
    CourseCatalogue:
      path: contracts/course-catalogue.schema.json
      version: "1.0.0"
    EvidencePreview:
      path: contracts/evidence-preview.schema.json
      version: "1.0.0"
    TranscriptExtraction:
      path: contracts/transcript-extraction.schema.json
      version: "1.0.0"
    TranscriptAssessmentRequest:
      path: contracts/transcript-assessment-request.schema.json
      version: "1.0.0"
    TranscriptAssessmentResponse:
      path: contracts/transcript-assessment-response.schema.json
      version: "1.0.0"
    TranscriptFollowupRequest:
      path: contracts/transcript-followup-request.schema.json
      version: "1.0.0"
    TranscriptFollowupResponse:
      path: contracts/transcript-followup-response.schema.json
      version: "1.0.0"
    SourceEntry:
      path: contracts/source-entry.schema.json
      version: "2.0.0"
    RuleFact:
      path: contracts/rule-fact.schema.json
      version: "2.1.0"
    EvidencePacket:
      path: contracts/evidence-packet.schema.json
      version: "2.0.0"
    AcademicAnswerRequest:
      path: contracts/academic-answer-request.schema.json
      version: "1.0.0"
    AcademicAnswerResponse:
      path: contracts/academic-answer-response.schema.json
      version: "1.0.0"
    AcademicChatResponse:
      path: contracts/academic-chat-response.schema.json
      version: "1.0.0"
      # Optional verified generation fields are emitted only after explicit opt-in.
    AcademicChatRequest:
      path: contracts/academic-chat-request.schema.json
      version: "1.0.0"
    AcademicFeedbackRequest:
      path: contracts/academic-feedback-request.schema.json
      version: "1.0.0"
    AcademicFeedbackResponse:
      path: contracts/academic-feedback-response.schema.json
      version: "1.0.0"
    AcademicIntentProfile:
      path: contracts/academic-intent-profile.schema.json
      version: "1.0.0"
    AcademicReviewPacket:
      path: contracts/academic-review-packet.schema.json
      version: "1.0.0"
    AcademicClarificationPacket:
      path: contracts/academic-clarification-packet.schema.json
      version: "1.1.0"
    AcademicResearchItem:
      path: contracts/academic-research-item.schema.json
      version: "1.0.0"
    DSWRunRequest:
      path: contracts/dsw-run-request.schema.json
      version: "1.0.0"
    TaskResult:
      path: contracts/task-result.schema.json
      version: "1.0.0"
    CompletionReport:
      path: contracts/completion-report.schema.json
      version: "1.0.0"

reporting:
  raw_run_data:
    - .harness/runs/
    - _workspace/communications/
  public_outputs:
    changelog: CHANGELOG.md
    markdown: reports/runs/<run-id>.md
    json: reports/runs/<run-id>.json
    pdf: reports/pdf/<run-id>.pdf
  pdf_required_for:
    - product_behavior_change
    - academic_rule_or_ontology_change
    - API_schema_or_contract_change
    - DSW_or_model_configuration_change
    - privacy_or_security_policy_change
    - milestone_completion
  sanitize_before_publication:
    - student_identifiers
    - server_connection_values
    - secrets
    - local_absolute_paths

documentation:
  index: docs/harness/README.md
  architecture: docs/harness/architecture.md
  agents_and_permissions: docs/harness/agents-and-permissions.md
  workflows: docs/harness/workflows.md
  contracts: docs/harness/contracts.md
  reporting: docs/harness/reporting.md
  dsw_operations: docs/harness/dsw-operations.md
  upstream: docs/harness/upstream.md
  decisions: docs/harness/decisions/
  minimal_prototype: docs/operations/minimal-prototype.md

validation:
  semantic_retrieval:
    command: python -m unittest tests.test_semantic_assistant_worker tests.test_semantic_assistant_qa tests.test_semantic_integration -v
    browser_consumer_command: node tests/web/semantic_dialogue_ui_test.cjs
    checks:
      - LLM_first_typed_read_only_tool_plan_not_question_whitelist
      - exact_course_credit_category_offering_source_binding
      - natural_writer_cannot_change_grounded_semantics
      - current_transcript_not_sent_to_model
      - shared_turn_budget_and_truthful_processing_failure
      - real_synthetic_PDF_examples_not_hardcoded_extraction
      - isolated_student_question_generation_and_heldout_evaluation
  grounded_generation:
    command: python -m unittest discover -s tests -p test_gemma_final_qa.py
    checks:
      - approved_public_claims_only
      - exact_semantic_grammar_and_complete_coverage
      - immutable_core_and_explicit_opt_in
      - no_student_question_transcript_or_personal_credits
      - shared_bounded_inference_and_public_cache
      - truthful_generated_cached_or_trusted_fallback
  transcript_prototype:
    command: python scripts/validation/validate_transcript_prototype.py
    checks:
      - bounded_memory_only_local_extraction
      - explicit_human_confirmation
      - admission_year_and_degree_track_gates
      - approved_evidence_for_partial_checks
      - zero_credit_and_duplicate_uncertainty
      - no_final_graduation_certification_or_LLM_student_records
      - canonical_nested_evidence_and_separate_policy_reference
      - full_PDF_process_deadline
      - latest_followup_response_ordering
  synchronization:
    command: python scripts/validation/validate_harness_sync.py --project .
    compares:
      - manifest_to_agent_toml
      - manifest_to_skill_frontmatter
      - manifest_to_json_schema
      - manifest_to_codex_config
      - manifest_to_documentation
    json_schema_meta_schema: https://json-schema.org/draft/2020-12/schema
  academic_knowledge:
    command: python scripts/validation/validate_academic_knowledge.py --project .
    checks:
      - source_and_rule_schema
      - evidence_source_references
      - rule_relationship_targets
      - approved_authoritative_evidence
      - review_queue_completeness
      - graduation_thesis_fact_separation
  academic_clarifications:
    command: python scripts/validation/validate_academic_clarifications.py --project .
    checks:
      - exact_review_subject_coverage
      - evidence_snapshot_integrity
      - bounded_question_choices
      - session_scoped_department_confirmation
      - fail_closed_unanswered_rules
      - preserved_higher_authority_conflicts
      - immutable_preapproval_subject_content
      - attested_user_responses_and_review_metadata
  academic_research:
    command: python scripts/validation/validate_academic_research.py --project .
    checks:
      - unverified_claim_schema
      - linked_rule_and_review_session
      - answer_evidence_isolation
      - insufficient_evidence_until_official_source
      - paraphrase_injection_blocked_by_preapproval_content_lock
  academic_answer_engine:
    command: python scripts/validation/validate_academic_answer_engine.py --project .
    checks:
      - explicit_registry_profile
      - deterministic_intent_matching
      - evidence_packet_grounding
      - exact_265_case_evaluation
      - API_CLI_core_parity
  academic_web_prototype:
    command: python -m unittest tests.test_academic_web_prototype -v
    checks:
      - fixed_localhost_routes
      - fixed_visible_scope
      - four_status_presentation
      - safe_evidence_rendering
      - accessibility_and_keyboard
      - no_browser_persistence
      - security_response_headers
      - packaged_web_assets
      - openapi_docs_compatibility
      - optional_credit_input_and_gap_calculation
      - explicit_consent_local_feedback
      - identifying_feedback_rejection
  academic_usability_pilot:
    command: python scripts/validation/validate_academic_usability.py --project .
    checks:
      - exact_30_realistic_question_scenarios
      - supported_answers_have_approved_evidence
      - unsupported_answers_have_no_rules_or_evidence
      - four_credit_gap_calculations
      - protected_and_scope_boundaries
  reference_patterns:
    command: python scripts/validation/validate_reference_patterns.py --project .
    checks:
      - exact_15_new_synthetic_patterns_not_transcript_replay
      - supported_current_evidence
      - API_CLI_core_parity
      - human_UAT_separate_not_run
  graph_runtime:
    command: python -m unittest tests.test_neo4j_evidence tests.test_academic_kg -v
    checks:
      - exact_current_registry_projection
      - bounded_read_transaction
      - activated_backend_failure_closed
      - atomic_empty_database_unique_key
  llm_budget:
    command: python -m unittest tests.test_llm_budget -v
    checks:
      - process_wide_single_inference_no_queue
      - bounded_topic_code_cache
      - request_interval_and_failure_cooldown
  natural_conversation:
    command: python -m unittest tests.test_natural_conversation_qa -v
    heldout_command: python -m unittest tests.test_natural_conversation_heldout -v
    checks:
      - all_registered_intents_and_held_out_phrasings
      - complete_query_and_unsupported_clause_guards
      - no_model_first_friendly_response
      - supported_current_evidence_and_ordered_claims
      - separate_current_transcript_context_and_reset
      - compatible_legacy_wire_and_contracts
      - optional_refinement_cannot_replace_canonical_result
    browser_consumer_command: node tests/web/natural_conversation_ui_test.cjs
  evidence_preview:
    command: python -m unittest discover -s tests -p test_evidence_pdf.py -v
    checks:
      - approved_source_sha256_per_request
      - cited_pages_only
      - exact_unique_text_or_table_intersection
      - page_only_for_ambiguous_or_handwritten_source
      - immutable_original_and_memory_only_copy
      - bounded_preview_concurrency
  mermaid:
    command: python scripts/validation/render_mermaid.py --project . --output-dir <temporary-directory> --puppeteer-config scripts/validation/puppeteer-ci.json
    cli_package: "@mermaid-js/mermaid-cli@11.12.0"
  documentation_freshness:
    requires_docs_and_adr_for:
      - AGENTS.md
      - harness-manifest.yaml
      - .codex/config.toml
      - .codex/agents/
      - .agents/skills/
      - contracts/
      - .github/workflows/harness-ci.yml
      - scripts/reporting/
      - scripts/validation/
