name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/reporting/requirements.txt
            pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reporting dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/reporting/requirements.txt
      - name: Install academic answer engine
        run: python -m pip install --disable-pip-version-check -e ".[test,graph]"
      - name: Install pinned Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.12.0
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate transcript contracts and canonical nested evidence
        run: python scripts/validation/validate_transcript_prototype.py
      - name: Validate transcript latest-response ordering
        run: node tests/transcript_web_ordering.cjs
      - name: Validate evidence viewer ordering and safety
        run: node tests/test_evidence_ui.js
      - name: Validate transcript cancellation and isolation
        run: node tests/web/transcript_lifecycle_test.js
      - name: Validate verified Gemma text consumer and opt-in
        run: node tests/web/gemma_final_ui_test.cjs
      - name: Validate friendly conversation, transcript reuse and staged reply lifecycle
        run: node tests/web/natural_conversation_ui_test.cjs
      - name: Validate default semantic dialogue and one-click PDF consumer
        run: node tests/web/semantic_dialogue_ui_test.cjs
      - name: Validate observed B progress stream, loading and cancellation
        run: node tests/web/b_progress_ui_test.cjs
      - name: Build wheel and verify packaged web assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path(__import__('os').environ['RUNNER_TEMP'], 'wheel').glob('*.whl'))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {f'academic_assistant/web/{name}' for name in ('index.html', 'app.css', 'app.js')}
          required.update({'academic_assistant/web/transcript.js', 'academic_assistant/ocr_windows.ps1'})
          required.update({'academic_assistant/web/evidence.js', 'academic_assistant/web/evidence.css'})
          required.update({'academic_assistant/web/semantic-ui.js', 'academic_assistant/web/examples/manifest.json'})
          required.update({f'academic_assistant/web/examples/{name}.pdf' for name in ('early', 'near-graduation', 'retake')})
          missing = required - names
          if missing:
              raise SystemExit(f'missing packaged web assets: {sorted(missing)}')
          PY
      - name: Validate Codex harness structure
        run: python .agents/skills/harness/scripts/validate.py --project .
      - name: Validate harness manifest synchronization and JSON Schema meta-schemas
        run: python scripts/validation/validate_harness_sync.py --project .
      - name: Validate academic sources, rules, relationships, and review queue
        run: python scripts/validation/validate_academic_knowledge.py --project .
      - name: Validate academic clarification coverage and session authority
        run: python scripts/validation/validate_academic_clarifications.py --project .
      - name: Validate unverified academic research isolation
        run: python scripts/validation/validate_academic_research.py --project .
      - name: Validate deterministic academic answer engine and evaluation set
        run: python scripts/validation/validate_academic_answer_engine.py --project .
      - name: Validate 30-case academic web usability pilot
        run: python scripts/validation/validate_academic_usability.py --project .
      - name: Validate fresh reference-derived synthetic patterns
        run: python scripts/validation/validate_reference_patterns.py --project .
      - name: Validate private localhost pilot readiness
        run: python scripts/operations/check_pilot_readiness.py --project .
      - name: Render every harness Mermaid block
        run: >-
          python scripts/validation/render_mermaid.py
          --project .
          --output-dir "$RUNNER_TEMP/mermaid-rendered"
          --puppeteer-config scripts/validation/puppeteer-ci.json
      - name: Validate public reports and harness documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/reporting/ci_checks.py --project . --changed-from "$BASE_SHA"
          else
            python scripts/reporting/ci_checks.py --project .
          fi
