name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/reporting/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reporting dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/reporting/requirements.txt
      - name: Install pinned Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.12.0
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate Codex harness structure
        run: python .agents/skills/harness/scripts/validate.py --project .
      - name: Validate harness manifest synchronization and JSON Schema meta-schemas
        run: python scripts/validation/validate_harness_sync.py --project .
      - name: Validate academic sources, rules, relationships, and review queue
        run: python scripts/validation/validate_academic_knowledge.py --project .
      - name: Render every harness Mermaid block
        run: >-
          python scripts/validation/render_mermaid.py
          --project .
          --output-dir "$RUNNER_TEMP/mermaid-rendered"
          --puppeteer-config scripts/validation/puppeteer-ci.json
      - name: Validate public reports and harness documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/reporting/ci_checks.py --project . --changed-from "$BASE_SHA"
          else
            python scripts/reporting/ci_checks.py --project .
          fi
