[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "academic-assistant"
version = "0.11.0"
description = "Source-grounded semantic 2026 Computer Engineering assistant with deterministic academic checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "jsonschema==4.25.1",
  "pydantic==2.11.9",
  "uvicorn==0.35.0",
  "pypdfium2==5.10.1",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
graph = ["neo4j==6.3.1"]

[project.scripts]
academic-assistant = "academic_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_assistant"]
